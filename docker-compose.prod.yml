# Despliegue en el NAS (Docker Compose, igual que Caddy/n8n).
# Usa la red overlay `edge` para que Caddy alcance el frontend, y la red
# `n8n_net` para alcanzar la base de datos existente `datagastos_db`.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [interna]

  finanzas-api:
    build: ./backend
    image: finanzas-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dashboard_app:${DB_PASSWORD}@datagastos_db:5432/consumos
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      NODE_ENV: production
    depends_on: [redis]
    networks: [interna, datos]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  finanzas-web:
    build: ./frontend
    image: finanzas-web:latest
    restart: unless-stopped
    depends_on: [finanzas-api]
    networks: [interna, edge]

networks:
  interna:
  edge:
    external: true
  datos:
    external: true
    name: n8n_net
